<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LRL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10181D;
    --ink-soft:#17222A;
    --ink-line: rgba(214,226,232,0.10);
    --paper:#1E2C34;
    --paper-dim:#2A3D47;
    --text-light:#D9E2E6;
    --text-muted:#7C8D95;
    --text-dark:#D9E2E6;
    --text-dark-soft: rgba(217,226,230,0.66);
    --accent:#6FAFD9;
    --accent-soft: rgba(111,175,217,0.14);
    --radius: 3px;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--text-light);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  a{ color:inherit; }

  ::selection{ background:var(--accent); color:var(--text-light); }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
  }

  /* ---------- Capa de fondo global ---------- */
  .bg-fx{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .bg-tone{
    position:absolute;
    inset:-20%;
    background:radial-gradient(circle at 50% 0%, var(--accent-soft), transparent 60%);
    filter:hue-rotate(0deg);
    transition:filter .5s ease;
  }
  .bg-spotlight{
    position:absolute;
    inset:0;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,10%), rgba(111,175,217,0.10), transparent 70%);
  }
  .bg-noise{
    position:absolute;
    inset:-10%;
    opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation:grain 9s ease-in-out infinite;
  }
  @keyframes grain{
    0%,100%{ transform:translate(0,0); }
    25%{ transform:translate(-2%,-3%); }
    50%{ transform:translate(-4%,2%); }
    75%{ transform:translate(2%,-2%); }
  }
  header, .toolbar, main, footer{ position:relative; z-index:1; }

  /* ---------- Barra de progreso de scroll ---------- */
  .scroll-progress{
    position:fixed;
    top:0; left:0;
    height:2px;
    width:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent-soft));
    transform:scaleX(0);
    transform-origin:left;
    z-index:100;
    pointer-events:none;
  }

  /* ---------- Header ---------- */
  .site-header{
    padding:72px 48px 36px;
    border-bottom:1px solid var(--ink-line);
    position:relative;
    overflow:hidden;
  }
  .ambient-glow{
    position:absolute;
    inset:-50% -10% auto -10%;
    height:160%;
    background:radial-gradient(circle at 30% 30%, var(--accent-soft), transparent 62%);
    filter:blur(50px);
    animation:drift 17s ease-in-out infinite alternate;
    pointer-events:none;
    z-index:0;
  }
  @keyframes drift{
    0%{ transform:translate(-4%,-3%) scale(1); }
    100%{ transform:translate(5%,4%) scale(1.1); }
  }
  .header-row, .accent-rule{ position:relative; z-index:1; }
  .header-row > div, .drawer-label{
    opacity:0;
    animation:fadeInUp .7s ease forwards;
  }
  .header-row > div{ animation-delay:.05s; }
  .drawer-label{ animation-delay:.2s; }
  .accent-rule{ opacity:0; animation:fadeInUp .7s ease forwards; animation-delay:.35s; }
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(3.2rem, 9vw, 6rem);
    letter-spacing:-0.03em;
    line-height:0.9;
    margin:0;
  }
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:11.5px;
    color:var(--text-muted);
    margin:14px 0 0;
    max-width:34ch;
  }
  .drawer-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--text-muted);
    border:1px solid var(--ink-line);
    padding:10px 16px;
    border-radius:2px;
    white-space:nowrap;
  }
  .drawer-label strong{
    color:var(--text-light);
    font-weight:500;
  }
  .live-dot{
    display:inline-block;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    margin-right:7px;
    position:relative;
    top:-1px;
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ opacity:.45; transform:scale(.85); box-shadow:0 0 0 0 var(--accent-soft); }
    50%{ opacity:1; transform:scale(1.1); box-shadow:0 0 0 4px var(--accent-soft); }
  }
  .accent-rule{
    margin-top:36px;
    height:2px;
    background:linear-gradient(90deg, var(--accent), transparent 70%);
    overflow:hidden;
  }
  .accent-rule::after{
    content:'';
    position:absolute;
    top:0; left:-30%;
    width:30%; height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation:shimmer 5.5s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{ left:-30%; }
    55%{ left:110%; }
    100%{ left:110%; }
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    position:sticky;
    top:0;
    z-index:5;
    background:rgba(23,34,42,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--ink-line);
    padding:18px 48px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    transition:padding .25s ease, box-shadow .25s ease;
  }
  .toolbar.is-compact{
    padding:10px 48px;
    box-shadow:0 8px 18px rgba(0,0,0,0.35);
  }
  .search-wrap{
    position:relative;
    flex:1 1 240px;
    max-width:360px;
  }
  .search-wrap input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--ink-line);
    color:var(--text-light);
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    padding:8px 2px;
    position:relative;
    transition:border-color .2s ease;
  }
  .search-wrap input:focus{
    border-color:var(--accent);
    outline:none;
    animation:focusGlow .6s ease;
  }
  @keyframes focusGlow{
    0%{ box-shadow:0 4px 0 -3px var(--accent-soft); }
    100%{ box-shadow:0 4px 10px -6px transparent; }
  }
  .fake-placeholder{
    position:absolute;
    left:2px; top:8px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .fake-placeholder .caret{
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .tags-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid var(--ink-line);
    background:transparent;
    color:var(--text-muted);
    cursor:pointer;
    transition:color .18s ease, border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .chip:hover{ color:var(--text-light); border-color:var(--text-muted); transform:translateY(-1px); }
  .chip:active{ transform:scale(.93); }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--ink);
    animation:chipPop .3s ease;
  }
  @keyframes chipPop{
    0%{ transform:scale(.9); }
    60%{ transform:scale(1.05); }
    100%{ transform:scale(1); }
  }

  .count{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-muted);
    white-space:nowrap;
  }

  /* ---------- Grid ---------- */
  main{ padding:44px 48px 20px; }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:22px;
  }

  .card{
    background:var(--paper);
    color:var(--text-dark);
    border-radius:var(--radius);
    padding:26px 22px 20px;
    position:relative;
    border:1px solid var(--ink-line);
    box-shadow:0 1px 0 rgba(0,0,0,0.15);
    opacity:0;
    transform:translateY(10px);
    animation:rise .5s ease forwards;
    animation-delay: calc(var(--i, 0) * 60ms);
    display:flex;
    flex-direction:column;
    min-height:250px;
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }
  .card:hover{
    box-shadow:0 14px 26px rgba(0,0,0,0.45), 0 0 0 1px var(--accent-soft);
    transform:translateY(-4px) scale(1.012);
  }
  .card:hover{ transition:box-shadow .3s ease, transform .3s ease; }
  .card:hover .stamp{ animation-play-state:paused; transform:rotate(-2deg) scale(1.05); }

  .catalog-no{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.06em;
    color:var(--accent);
  }

  .stamp{
    position:absolute;
    top:-11px;
    right:16px;
    border:1.5px dashed var(--accent);
    color:var(--accent);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:2px;
    background:var(--paper);
    transform:rotate(-6deg);
    animation:wiggle 4.5s ease-in-out infinite;
    transition:transform .25s ease;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-6deg); }
    50%{ transform:rotate(-3deg); }
  }

  .card h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    font-weight:600;
    line-height:1.28;
    margin:10px 0 8px;
  }

  .card p{
    font-size:14px;
    line-height:1.58;
    color:var(--text-dark-soft);
    margin:0 0 16px;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .card-tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:18px;
  }
  .tag-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    background:var(--paper-dim);
    color:var(--text-muted);
    padding:4px 9px;
    border-radius:20px;
  }

  .card-footer{
    margin-top:auto;
    padding-top:14px;
    border-top:1px dashed var(--ink-line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
  }
  .view-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:500;
    color:var(--accent);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    position:relative;
  }
  .view-link::after{
    content:'';
    position:absolute;
    left:0; bottom:-2px;
    width:100%; height:1px;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .25s ease;
  }
  .view-link:hover::after{ transform:scaleX(1); }
  .view-link span{
    transition:transform .18s ease;
    display:inline-block;
  }
  .view-link:hover span{ transform:translateX(3px); }
  .view-link{ overflow:hidden; }
  .ripple{
    position:absolute;
    border-radius:50%;
    background:var(--accent-soft);
    transform:scale(0);
    animation:rippleAnim .5s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{
    to{ transform:scale(3); opacity:0; }
  }

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:80px 20px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    animation:fadeInUp .4s ease;
  }
  .empty-icon{
    margin-bottom:14px;
    animation:floatIcon 2.6s ease-in-out infinite;
  }
  @keyframes floatIcon{
    0%,100%{ transform:translateY(0); opacity:.55; }
    50%{ transform:translateY(-6px); opacity:1; }
  }

  /* ---------- Modal de lectura (informes .md) ---------- */
  .view-link.md-trigger{
    -webkit-appearance:none;
    appearance:none;
    background:none;
    border:none;
    margin:0;
    font:inherit;
    padding:0;
    cursor:pointer;
    text-align:left;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    background:rgba(6,10,13,0.72);
    backdrop-filter:blur(5px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .modal-overlay.is-open{
    opacity:1;
    pointer-events:auto;
  }
  .modal-panel{
    background:var(--paper);
    color:var(--text-light);
    width:min(720px, 92vw);
    max-height:82vh;
    overflow-y:auto;
    border-radius:4px;
    border:1px solid var(--ink-line);
    padding:34px 36px 40px;
    box-shadow:0 24px 60px rgba(0,0,0,0.5);
    transform:scale(.96) translateY(8px);
    transition:transform .25s ease;
  }
  .modal-overlay.is-open .modal-panel{
    transform:scale(1) translateY(0);
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .modal-close{
    background:none;
    border:1px solid var(--ink-line);
    color:var(--text-muted);
    width:28px; height:28px;
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    transition:color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .modal-close:hover{ color:var(--text-light); border-color:var(--text-muted); transform:rotate(90deg); }
  #modalTitle{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:22px;
    margin:8px 0 22px;
  }
  .modal-body{
    font-size:14.5px;
    line-height:1.75;
    color:var(--text-dark-soft);
  }
  .modal-body h1, .modal-body h2, .modal-body h3{
    font-family:'Space Grotesk', sans-serif;
    color:var(--text-light);
    line-height:1.3;
    margin:26px 0 10px;
  }
  .modal-body p{ margin:0 0 14px; }
  .modal-body ul, .modal-body ol{ margin:0 0 14px; padding-left:20px; }
  .modal-body a{ color:var(--accent); }
  .modal-body code{
    font-family:'IBM Plex Mono', monospace;
    background:var(--paper-dim);
    padding:2px 5px;
    border-radius:3px;
    font-size:13px;
  }
  .modal-body pre{
    background:var(--paper-dim);
    padding:14px 16px;
    border-radius:4px;
    overflow-x:auto;
  }
  .modal-body pre code{ background:none; padding:0; }
  .modal-body blockquote{
    margin:0 0 14px;
    padding-left:14px;
    border-left:2px solid var(--accent);
    color:var(--text-muted);
  }
  .modal-loading, .modal-error{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--text-muted);
  }

  footer{
    margin-top:40px;
    padding:26px 48px 40px;
    border-top:1px solid var(--ink-line);
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-muted);
  }

  @media (max-width: 640px){
    .site-header{ padding:48px 20px 28px; }
    .toolbar{ padding:14px 20px; }
    main{ padding:30px 20px 10px; }
    footer{ padding:20px 20px 30px; }
    .count{ margin-left:0; width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; opacity:1; transform:none; }
    .card:hover{ transform:none; }
    .ambient-glow{ animation:none; }
    .accent-rule::after{ animation:none; display:none; }
    .live-dot{ animation:none; opacity:1; }
    .stamp{ animation:none; }
    .fake-placeholder .caret{ animation:none; }
    .header-row > div, .drawer-label, .accent-rule{ animation:none; opacity:1; }
    .search-wrap input:focus{ animation:none; }
    .chip.active{ animation:none; }
    .bg-noise{ animation:none; }
    .bg-tone{ transition:none; }
    .empty-icon{ animation:none; }
    .empty-state{ animation:none; }
    .ripple{ display:none; }
    .modal-overlay, .modal-panel{ transition:none; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

  <div class="bg-fx" aria-hidden="true">
    <div class="bg-tone" id="bgTone"></div>
    <div class="bg-spotlight" id="bgSpotlight"></div>
    <div class="bg-noise"></div>
  </div>
  <div class="scroll-progress" id="scrollProgress"></div>

  <header class="site-header">
    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="header-row">
      <div>
        <div class="wordmark"><img src="lrl_logo_full_no-bg.png" width="100%"></div>
        <p class="tagline">Biblioteca abierta de informes y experimentos científicos</p>
      </div>
      <div class="drawer-label"><span class="live-dot" aria-hidden="true"></span>registros archivados&nbsp; <strong id="totalCount">—</strong></div>
    </div>
    <div class="accent-rule"></div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <input id="searchInput" type="text" autocomplete="off" aria-label="Buscar informes">
      <span class="fake-placeholder" id="fakePlaceholder">buscar<span class="caret">_</span></span>
    </div>
    <div class="tags-row" id="tagsRow"></div>
    <div class="count" id="resultCount"></div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <span>LRL · biblioteca de acceso abierto</span>
  </footer>

  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <span class="catalog-no" id="modalCodigo"></span>
        <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      </div>
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

<script>
  const ENTRADAS = [
    {
      codigo: "CRISPR",
      titulo: "Protocolo Phi-CRISPR-Cas9",
      resumen: "Desarrollar una plataforma basada en CRISPR-Cas9 capaz de editar con precisión el genoma de células humanas para corregir mutaciones patológicas y sentar las bases de terapias genéticas eficaces y controladas.",
      tags: ["Oncología"],
      fecha: "01-2024",
      autor: "LRL",
      tipo: "md",
      archivo: "../md/protocolo-phi-crispr.md"
    },
    {
      codigo: "SOLARIS",
      titulo: "Proyecto Solaris",
      resumen: "Solaris es una arquitectura de acceso orbital basada en lanzamiento asistido sin propelente en la fase inicial, donde una única etapa química realiza el ascenso y la inserción orbital, complementada por navegación autónoma (ANST) y propulsión avanzada (iónica y nuclear) para operación y escalabilidad en órbita.",
      tags: ["Astronáutica"],
      fecha: "02-2025",
      autor: "LASU",
      tipo: "md",
      archivo: "../md/osS.md"
    },
    {
      codigo: "MMR",
      titulo: "Redundancia por Fusión Matricial",
      resumen: "Desarrollar un sistema de redundancia estructurada que combine múltiples matrices de información para preservar integridad, tolerar fallos y garantizar continuidad operativa bajo condiciones críticas.",
      tags: ["Electrónica"],
      fecha: "09-2025",
      autor: "Equipo LASU",
      tipo: "pdf",
      archivo: "../pdfs/mmr.pdf"
    },
    {
      codigo: "ANST",
      titulo: "Sistema de Navegación Astronómica por Triangulación",
      resumen: "Desarrollar un sistema de navegación autónomo basado en la triangulación de referencias astronómicas que permita determinar posición y orientación con precisión sin depender de infraestructura terrestre.",
      tags: ["Astronáutica"],
      fecha: "07-2025",
      autor: "Equipo LASU",
      tipo: "pdf",
      archivo: "../pdfs/anst.pdf"
    },
    {
      codigo: "STU",
      titulo: "Teoría de Simetria Topológica Unificada",
      resumen: "Desarrollar un marco teórico que unifique las simetrías fundamentales mediante estructuras topológicas, con el fin de describir de forma coherente las interacciones físicas bajo un mismo principio matemático.",
      tags: ["Relatividad"],
      fecha: "07-2025",
      autor: "Equipo LRL",
      tipo: "pdf",
      archivo: "../pdfs/stu.pdf"
    },
    {
      codigo: "STU-2",
      titulo: "Concentración extrema de energía y formación de agujeros negros artificiales",
      resumen: "Experimento controlado sobre el efecto de la privación parcial de sueño en pruebas de tiempo de reacción simple y de elección múltiple.",
      tags: ["Relatividad"],
      fecha: "08-2026",
      autor: "Ezequiel, LRL",
      tipo: "pdf",
      archivo: "../pdfs/stu2.pdf"
    },
    {
      codigo: "CRISPR-2",
      titulo: "Efecto de la microgravedad sobre la progresión tumoral: evaluación en modelo murino",
      resumen: "La microgravedad puede revelar y modular vulnerabilidades físicas de los oncogenes, ofreciendo nuevas vías indirectas para su tratamiento.",
      tags: ["Oncología"],
      fecha: "08-2026",
      autor: "Ezequiel, LRL",
      tipo: "pdf",
      archivo: "../pdfs/crisprphi2.pdf"
    }
  ];

  const grid = document.getElementById('grid');
  const tagsRow = document.getElementById('tagsRow');
  const searchInput = document.getElementById('searchInput');
  const fakePlaceholder = document.getElementById('fakePlaceholder');
  const resultCount = document.getElementById('resultCount');
  const totalCount = document.getElementById('totalCount');

  let activeTag = 'Todos';
  let query = '';

  const allTags = ['Todos', ...Array.from(new Set(ENTRADAS.flatMap(e => e.tags)))];

  function buildChips(){
    tagsRow.innerHTML = '';
    allTags.forEach(tag => {
      const chip = document.createElement('button');
      chip.className = 'chip' + (tag === activeTag ? ' active' : '');
      chip.textContent = tag;
      chip.addEventListener('click', () => {
        activeTag = tag;
        buildChips();
        render();
      });
      tagsRow.appendChild(chip);
    });
  }

  function matches(entry){
    const inTag = activeTag === 'Todos' || entry.tags.includes(activeTag);
    const q = query.trim().toLowerCase();
    const inQuery = !q || [entry.titulo, entry.resumen, entry.autor, entry.codigo, ...entry.tags]
      .join(' ').toLowerCase().includes(q);
    return inTag && inQuery;
  }

  function render(){
    const filtered = ENTRADAS.filter(matches);
    grid.innerHTML = '';

    if (filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `
        <svg class="empty-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <line x1="15.3" y1="15.3" x2="20.5" y2="20.5"></line>
        </svg>
        <p style="margin:0;">No se encontraron informes con esos criterios.</p>
      `;
      grid.appendChild(empty);
    } else {
      filtered.forEach((entry, i) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.style.setProperty('--i', i);

        const stampText = entry.tags[0] ? entry.tags[0].slice(0,3).toUpperCase() : 'LRL';
        const isMd = entry.tipo === 'md';
        const accion = isMd
          ? `<button class="view-link md-trigger" data-file="${entry.archivo}" data-titulo="${entry.titulo}" data-codigo="${entry.codigo}">Ver informe <span>→</span></button>`
          : `<a class="view-link" href="${entry.archivo}" target="_blank" rel="noopener">Ver PDF <span>→</span></a>`;

        card.innerHTML = `
          <span class="stamp">${stampText}</span>
          <span class="catalog-no">${entry.codigo}</span>
          <h3>${entry.titulo}</h3>
          <p>${entry.resumen}</p>
          <div class="card-tags">
            ${entry.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}
          </div>
          <div class="card-footer">
            <span class="meta">${entry.fecha} · ${entry.autor}</span>
            ${accion}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    resultCount.textContent = `mostrando ${filtered.length} de ${ENTRADAS.length}`;
  }

  searchInput.addEventListener('input', (e) => {
    query = e.target.value;
    fakePlaceholder.style.opacity = query.length ? '0' : '1';
    render();
  });

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  grid.addEventListener('click', (e) => {
    const mdBtn = e.target.closest('.md-trigger');
    if (mdBtn){
      openMdModal(mdBtn.dataset.file, mdBtn.dataset.titulo, mdBtn.dataset.codigo);
      return;
    }
    const link = e.target.closest('.view-link');
    if (!link || reduceMotion) return;
    const rect = link.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    link.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
  });

  /* --- modal de lectura para informes en Markdown --- */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalPanel = document.querySelector('.modal-panel');
  const modalTitle = document.getElementById('modalTitle');
  const modalCodigo = document.getElementById('modalCodigo');
  const modalBody = document.getElementById('modalBody');
  const modalClose = document.getElementById('modalClose');

  function openModal(){
    modalOverlay.classList.add('is-open');
    modalOverlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){
    modalOverlay.classList.remove('is-open');
    modalOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  async function openMdModal(file, titulo, codigo){
    modalTitle.textContent = titulo;
    modalCodigo.textContent = codigo;
    modalBody.innerHTML = '<p class="modal-loading">Cargando informe…</p>';
    openModal();
    try{
      const res = await fetch(file);
      if (!res.ok) throw new Error('archivo no encontrado');
      const raw = await res.text();
      modalBody.innerHTML = window.marked ? marked.parse(raw) : `<pre>${raw}</pre>`;
    } catch(err){
      modalBody.innerHTML = `<p class="modal-error">No se pudo cargar el informe (“${file}”). Si estás abriendo este HTML directamente desde tu computadora, el navegador puede bloquear esa carga — probá sirviendo la carpeta con un servidor local o subiéndola a un hosting.</p>`;
    }
  }

  modalClose.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('is-open')) closeModal();
  });

  totalCount.textContent = '00';
  buildChips();
  render();

  /* --- contador que cuenta hacia arriba al cargar --- */
  function animateCount(el, target, duration){
    if (reduceMotion){ el.textContent = String(target).padStart(2, '0'); return; }
    const start = performance.now();
    function tick(now){
      const progress = Math.min((now - start) / duration, 1);
      const value = Math.round(progress * target);
      el.textContent = String(value).padStart(2, '0');
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  animateCount(totalCount, ENTRADAS.length, 900);

  /* --- foco que sigue el mouse --- */
  const bgSpotlight = document.getElementById('bgSpotlight');
  if (!reduceMotion && window.matchMedia('(pointer: fine)').matches){
    window.addEventListener('mousemove', (e) => {
      bgSpotlight.style.setProperty('--mx', e.clientX + 'px');
      bgSpotlight.style.setProperty('--my', e.clientY + 'px');
    });
  }

  /* --- tono ambiental + barra de progreso + header compacto, ligados al scroll --- */
  const bgTone = document.getElementById('bgTone');
  const scrollProgress = document.getElementById('scrollProgress');
  const toolbar = document.querySelector('.toolbar');
  let ticking = false;

  function onScroll(){
    const scrollTop = window.scrollY;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const pct = max > 0 ? Math.min(scrollTop / max, 1) : 0;

    scrollProgress.style.transform = `scaleX(${pct})`;
    bgTone.style.filter = `hue-rotate(${pct * 45}deg)`;
    toolbar.classList.toggle('is-compact', scrollTop > 30);
    ticking = false;
  }

  window.addEventListener('scroll', () => {
    if (!ticking){
      requestAnimationFrame(onScroll);
      ticking = true;
    }
  });
  onScroll();
</script>

</body>
</html>
